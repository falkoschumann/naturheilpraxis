# $schema: ../schemas/domain-storytelling/v1.yaml
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: stammdaten-korrigieren
description: >-
  Ergänzt den Standardablauf: Der Heilpraktiker korrigiert die Stammdaten, also seine Praxen und das
  Gebührenverzeichnis. Ausgangspunkt ist eine angelegte Praxis.
scope:
  domain: naturheilpraxis
pointInTime: as-is
granularity: coarse-grained
domainPurity: pure
actors:
  - name: heilpraktiker
sentences:
  - sequenceNumber: 1
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: praxis
        label: korrigiert
  - sequenceNumber: 2
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: gebuehr
        label: legt an
      - from:
          workObject: gebuehr
        to:
          workObject: gebuehrenverzeichnis
        label: im
  - sequenceNumber: 3
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: gebuehr
        label: korrigiert
  - sequenceNumber: 4
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: gebuehr
        label: entfernt
      - from:
          workObject: gebuehr
        to:
          workObject: gebuehrenverzeichnis
        label: aus
  - sequenceNumber: 5
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: gebuehr
        label: stellt wieder her
