# $schema: ../schemas/domain-storytelling/v1.yaml
apiVersion: schema.esdm.io/domain-storytelling/v1
kind: domain-story
name: rechnung-korrigieren
description: >-
  Ergänzt den Standardablauf: Der Heilpraktiker korrigiert einen Rechnungsentwurf oder verwirft ihn,
  nimmt den Versand einer Rechnung zurück und nimmt einen irrtümlich vermerkten Zahlungseingang
  zurück. Ausgangspunkt ist ein Rechnungsentwurf aus einer Leistung wegen einer Diagnose.
scope:
  domain: naturheilpraxis
pointInTime: as-is
granularity: coarse-grained
domainPurity: pure
actors:
  - name: heilpraktiker
  - name: patient
    annotation: >-
      Ist an der Behandlung beteiligt, bedient aber nicht die Anwendung.
sentences:
  - sequenceNumber: 1
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: korrigiert
  - sequenceNumber: 2
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: verwirft
  - sequenceNumber: 3
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: erstellt erneut
      - from:
          workObject: rechnung
        to:
          workObject: leistung
        label: aus wieder nicht abgerechneter
  - sequenceNumber: 4
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: versendet
      - from:
          workObject: rechnung
        to:
          actor: patient
        label: an
  - sequenceNumber: 5
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: nimmt Versand zurück von
  - sequenceNumber: 6
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: rechnung
        label: versendet erneut
      - from:
          workObject: rechnung
        to:
          actor: patient
        label: an
  - sequenceNumber: 7
    edges:
      - from:
          actor: patient
        to:
          workObject: rechnung
        label: bezahlt
  - sequenceNumber: 8
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: zahlungseingang
        label: vermerkt
      - from:
          workObject: zahlungseingang
        to:
          workObject: rechnung
        label: auf
  - sequenceNumber: 9
    edges:
      - from:
          actor: heilpraktiker
        to:
          workObject: zahlungseingang
        label: nimmt zurück
