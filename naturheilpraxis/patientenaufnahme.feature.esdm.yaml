# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: patientenaufnahme
description: >-
  Der Heilpraktiker nimmt Patienten in einer Praxis auf. Die Patientennummer wird fortlaufend
  vergeben.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: patientenaufnahme
scenarios:
  - name: erster-patient-erhaelt-nummer-eins
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
    when:
      command: patient-aufnehmen
      data:
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "1980-09-20"
        name: { vorname: Max, nachname: Mustermann }
        anschrift: { strasse: Lindenweg 5, postleitzahl: "12345", ort: Musterstadt }
    then:
      events:
        - event: patient-aufgenommen
          data:
            patientennummer: 1
            praxiskuerzel: NHP
            aufnahmejahr: 2026
            geburtsdatum: "1980-09-20"
            name: { vorname: Max, nachname: Mustermann }
            anschrift: { strasse: Lindenweg 5, postleitzahl: "12345", ort: Musterstadt }

  - name: weiterer-patient-erhaelt-naechste-nummer
    description: >-
      Der neue Patient ist Partner eines bereits aufgenommenen Patienten und erhält die nächste
      Nummer.
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: patient-aufnehmen
      data:
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "1982-03-14"
        name: { vorname: Erika, nachname: Mustermann }
        partnerVon: 1
    then:
      events:
        - event: patient-aufgenommen
          data:
            patientennummer: 2
            praxiskuerzel: NHP
            aufnahmejahr: 2026
            geburtsdatum: "1982-03-14"
            name: { vorname: Erika, nachname: Mustermann }
            partnerVon: 1

  - name: aufnahme-in-unbekannter-praxis
    given: []
    when:
      command: patient-aufnehmen
      data:
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "1980-09-20"
        name: { vorname: Max, nachname: Mustermann }
    then:
      rejection:
        invariant: praxis-existiert

  - name: aufnahme-mit-unbekanntem-angehoerigen
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
    when:
      command: patient-aufnehmen
      data:
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "2010-05-01"
        name: { vorname: Paul, nachname: Mustermann }
        kindVon: 7
    then:
      rejection:
        invariant: angehoerige-existieren
