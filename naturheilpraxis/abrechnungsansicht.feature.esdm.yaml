# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: abrechnungsansicht
description: >-
  Der Heilpraktiker sieht die noch nicht abgerechneten Leistungen eines Patienten und die Liste der
  Rechnungen.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  readModel: abrechnungsansicht
scenarios:
