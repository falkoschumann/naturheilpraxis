        event: leistung-erbracht
        data:
          leistungId: 23232323-2323-4323-8323-232323232323
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-21"
          ziffer: "20.1"
          bezeichnung: Akupunktur
          anzahl: 2
          einzelbetrag: { cents: 1530 }
