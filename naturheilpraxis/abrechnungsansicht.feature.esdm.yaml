          leistungId: 24242424-2424-4424-8424-242424242424
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-07"
          ziffer: "4"
          bezeichnung: Kurze Information
          anzahl: 1
          einzelbetrag: { cents: 820 }
