      Leistungen in einer Rechnung und Leistungen anderer Patienten erscheinen nicht. Leistungen
      eines gelöschten Entwurfs sind wieder nicht abgerechnet.
    given:
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
