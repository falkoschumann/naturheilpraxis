          leistungId: 25252525-2525-4525-8525-252525252525
          praxiskuerzel: NHP
          patientennummer: 2
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
      - boundedContext: naturheilpraxis
        event: rechnung-erstellt
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          praxiskuerzel: NHP
