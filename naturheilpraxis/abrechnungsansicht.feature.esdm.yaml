          praxiskuerzel: NHP
          patientennummer: 1
          diagnosetext: Chronische Rückenschmerzen
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
          leistungen:
            - 24242424-2424-4424-8424-242424242424
      - boundedContext: naturheilpraxis
        event: entwurf-geloescht
        data:
          rechnungId: 34343434-3434-4434-8434-343434343434
    when:
      query: nicht-abgerechnete-leistungen-ermitteln
      parameters:
        patientennummer: 1
    then:
      result:
        - leistungId: 24242424-2424-4424-8424-242424242424
          praxiskuerzel: NHP
          patientennummer: 1
