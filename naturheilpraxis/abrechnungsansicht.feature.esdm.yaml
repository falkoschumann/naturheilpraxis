  - name: rechnungen-entwuerfe-zuerst-ermitteln
    description: >-
      Entwürfe stehen nach Patientenname sortiert zuerst, danach die übrigen Rechnungen neueste
      zuerst. Eine Rechnung, deren Versand zurückgenommen wurde, ist wieder ein Entwurf ohne
      Rechnungsnummer und Rechnungsdatum.
