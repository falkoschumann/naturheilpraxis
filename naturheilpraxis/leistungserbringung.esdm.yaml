# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: leistungserbringung
description: >-
  Verwaltet die Leistungen. Ob eine Leistung geändert oder gelöscht werden darf, hängt davon ab, ob
  sie in einer Rechnung enthalten ist und in welchem Status diese Rechnung ist. Deshalb werden auch
  die Ereignisse der Rechnungen betrachtet, die die Leistung enthalten oder enthielten.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
identifiedBy:
  - name: leistung
    source: command-payload
    field: leistungId
consults:
  - boundedContext: naturheilpraxis
    event: leistung-erbracht
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: leistung-geaendert
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: leistung-geloescht
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnung-erstellt
    criteria: Die Ereignisse der Rechnungen, die die Leistung enthalten oder enthielten.
  - boundedContext: naturheilpraxis
    event: rechnung-geaendert
    criteria: Die Ereignisse der Rechnungen, die die Leistung enthalten oder enthielten.
  - boundedContext: naturheilpraxis
    event: entwurf-geloescht
    criteria: Die Ereignisse der Rechnungen, die die Leistung enthielten.
  - boundedContext: naturheilpraxis
    event: rechnung-versendet
    criteria: Die Ereignisse der Rechnungen, die die Leistung enthalten oder enthielten.
  - boundedContext: naturheilpraxis
    event: rechnungsversand-zurueckgenommen
    criteria: Die Ereignisse der Rechnungen, die die Leistung enthalten oder enthielten.
  - boundedContext: naturheilpraxis
    event: praxis-angelegt
    criteria: >-
      Beim Erbringen und Ändern die Ereignisse der Praxis mit dem Kürzel aus dem Befehl.
  - boundedContext: naturheilpraxis
    event: patient-aufgenommen
    criteria: >-
      Beim Erbringen die Ereignisse des Patienten mit der Nummer aus dem Befehl.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: leistung-erbringen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: leistungserbringung
data:
  type: object
  properties:
    leistungId:
      type: string
      format: uuid
    praxiskuerzel:
      type: string
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
    datum:
      type: string
      format: date
    ziffer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=gebuehrenziffer
    bezeichnung:
      type: string
    anzahl:
      type: integer
      minimum: 1
    einzelbetrag:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=euro
  required:
    - leistungId
    - praxiskuerzel
    - patientennummer
    - datum
    - ziffer
    - bezeichnung
    - anzahl
    - einzelbetrag
  additionalProperties: false
publishes:
  - leistung-erbracht
actors:
  - heilpraktiker
constraints:
  - name: praxis-existiert
    rule: >-
      Die Praxis mit dem angegebenen Kürzel muss angelegt sein, sonst wird der Befehl abgelehnt.
  - name: patient-existiert
    rule: >-
      Der Patient mit der angegebenen Nummer muss aufgenommen sein, sonst wird der Befehl abgelehnt.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: leistung-erbracht
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=leistung

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: leistung-aendern
description: >-
  Der Patient einer Leistung kann nicht geändert werden, deshalb fehlt die Patientennummer im
  Befehl. Das veröffentlichte Ereignis enthält die bisherige Patientennummer.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: leistungserbringung
data:
  type: object
  properties:
    leistungId:
      type: string
      format: uuid
    praxiskuerzel:
      type: string
    datum:
      type: string
      format: date
    ziffer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=gebuehrenziffer
    bezeichnung:
      type: string
    anzahl:
      type: integer
      minimum: 1
    einzelbetrag:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=euro
  required:
    - leistungId
    - praxiskuerzel
    - datum
    - ziffer
    - bezeichnung
    - anzahl
    - einzelbetrag
  additionalProperties: false
publishes:
  - leistung-geaendert
actors:
  - heilpraktiker
constraints:
  - name: praxis-existiert
    rule: >-
      Die Praxis mit dem angegebenen Kürzel muss angelegt sein, sonst wird der Befehl abgelehnt.
  - name: nur-im-entwurf-aendern
    rule: >-
      Ist die Leistung in einer versendeten oder bezahlten Rechnung enthalten, wird die Änderung
      abgelehnt. Ist sie in einem Entwurf enthalten, darf sie geändert werden.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: leistung-geaendert
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=leistung

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: leistung-loeschen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: leistungserbringung
data:
  type: object
  properties:
    leistungId:
      type: string
      format: uuid
  required:
    - leistungId
  additionalProperties: false
publishes:
  - leistung-geloescht
actors:
  - heilpraktiker
constraints:
  - name: nur-ohne-rechnung-loeschen
    rule: >-
      Ist die Leistung in einer Rechnung enthalten, unabhängig von deren Status, wird das Löschen
      abgelehnt. Eine Leistung in einem Entwurf muss zuerst aus dem Entwurf entfernt werden.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: leistung-geloescht
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  type: object
  properties:
    leistungId:
      type: string
      format: uuid
  required:
    - leistungId
  additionalProperties: false
