# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: leistungserbringung
description: >-
  Verwaltet die Leistungen.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
identifiedBy:
  - name: leistung
    source: command-payload
    field: leistungId
consults:
  - boundedContext: naturheilpraxis
    event: leistung-erbracht
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: leistung-geaendert
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: leistung-geloescht
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnung-erstellt
    criteria: Die Leistung ist in der Rechnung enthalten.
  - boundedContext: naturheilpraxis
    event: rechnung-geaendert
    criteria: Die Leistung ist oder war in der Rechnung enthalten.
  - boundedContext: naturheilpraxis
    event: entwurf-geloescht
    criteria: Die Leistung war in der Rechnung enthalten.
  - boundedContext: naturheilpraxis
    event: rechnung-versendet
    criteria: Die Leistung ist in der Rechnung enthalten.
  - boundedContext: naturheilpraxis
    event: rechnungsversand-zurueckgenommen
    criteria: Die Leistung ist in der Rechnung enthalten.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: leistung-erbringen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: leistungserbringung
data:
  type: object
  properties:
    leistungId:
      type: string
      format: uuid
    praxiskuerzel:
      type: string
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
    datum:
      type: string
      format: date
    ziffer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=gebuehrenziffer
    bezeichnung:
      type: string
    anzahl:
      type: integer
      minimum: 1
    einzelbetrag:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=euro
  required:
    - leistungId
    - praxiskuerzel
    - patientennummer
    - datum
    - ziffer
    - bezeichnung
    - anzahl
    - einzelbetrag
  additionalProperties: false
publishes:
  - leistung-erbracht
actors:
  - heilpraktiker

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: leistung-erbracht
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=leistung

