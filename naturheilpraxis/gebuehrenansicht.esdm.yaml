# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: gebuehrenansicht
description: >-
  Das Gebührenverzeichnis mit seinem aktuellen Stand. Dient dem Auswählen einer Gebühr beim Erfassen
  einer Leistung und dem Pflegen des Verzeichnisses.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
paradigm: tabular
projections:
  - boundedContext: naturheilpraxis
    event: gebuehr-angelegt
    rule: Fügt die Gebühr hinzu.
  - boundedContext: naturheilpraxis
    event: gebuehr-geaendert
    rule: Aktualisiert die Gebühr.
  - boundedContext: naturheilpraxis
    event: gebuehr-entfernt
    rule: Entfernt die Gebühr.
schema:
  type: array
  items:
    $ref: urn:esdm:naturheilpraxis:naturheilpraxis:gebuehr

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: query
name: gebuehren-ermitteln
description: >-
  Ermittelt die Gebühren des Verzeichnisses, wahlweise eingeschränkt auf einen Suchbegriff.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
readModel: gebuehrenansicht
paradigm: tabular
parameters:
  type: object
  properties:
    suchbegriff:
      type: string
  additionalProperties: false
result:
  type: array
  items:
    $ref: urn:esdm:naturheilpraxis:naturheilpraxis:gebuehr
actors:
  - heilpraktiker
constraints:
  - name: nach-ziffer-sortiert
    rule: Die Gebühren sind alphanumerisch aufsteigend nach Ziffer sortiert.
  - name: suchbegriff-trifft-ziffer-und-bezeichnung
    rule: >-
      Ist ein Suchbegriff angegeben, bleiben nur Gebühren übrig, deren Ziffer oder Bezeichnung den
      Begriff enthält. Groß- und Kleinschreibung spielen keine Rolle.
