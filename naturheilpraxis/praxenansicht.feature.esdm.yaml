# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: praxenansicht
description: Der Heilpraktiker sieht seine Praxen im aktuellen Stand.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  readModel: praxenansicht
scenarios:
  - name: praxen-nach-kuerzel-sortiert-ermitteln
    description: Die Praxisdaten sind auf dem Stand der letzten Änderung.
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: ABC
          name: Heilpraxis am Bahnhof
          anschrift: { strasse: Bahnhofstraße 7, postleitzahl: "54321", ort: Beispielstadt }
          kontakt: { telefon: "0543 21", email: bahnhof@example.com }
      - boundedContext: naturheilpraxis
        event: praxisdaten-geaendert
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 2, postleitzahl: "12345", ort: Musterstadt }
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
    when:
      query: praxen-ermitteln
      parameters: {}
    then:
      result:
        - praxiskuerzel: ABC
          name: Heilpraxis am Bahnhof
          strasse: Bahnhofstraße 7
          postleitzahl: "54321"
          ort: Beispielstadt
          telefon: "0543 21"
          email: bahnhof@example.com
        - praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          strasse: Marktplatz 2
          postleitzahl: "12345"
          ort: Musterstadt
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.

  - name: praxis-ermitteln
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: ABC
          name: Heilpraxis am Bahnhof
          anschrift: { strasse: Bahnhofstraße 7, postleitzahl: "54321", ort: Beispielstadt }
    when:
      query: praxis-ermitteln
      parameters:
        praxiskuerzel: NHP
    then:
      result:
        praxiskuerzel: NHP
        name: Naturheilpraxis am Markt
        anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
