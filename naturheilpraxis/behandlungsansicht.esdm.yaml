# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: read-model
name: behandlungsansicht
description: >-
  Die Behandlungshistorie aller Patienten in Form von gestellte Diagnosen und erbrachte Leistungen,
  jeweils in ihrem aktuellen Stand. Gelöschte Diagnosen und Leistungen erscheinen nicht mehr. Zu
  jeder abgerechneten Leistung ist die Rechnung mit ihrem Status bekannt, in der sie enthalten ist.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
paradigm: time-series
projections:
  - boundedContext: naturheilpraxis
    event: diagnose-gestellt
    rule: Füge die Diagnose hinzu.
  - boundedContext: naturheilpraxis
    event: diagnose-geaendert
    rule: Aktualisiere die Diagnose.
  - boundedContext: naturheilpraxis
    event: diagnose-geloescht
    rule: Entferne die Diagnose.
  - boundedContext: naturheilpraxis
    event: leistung-erbracht
    rule: Füge die Leistung hinzu.
  - boundedContext: naturheilpraxis
    event: leistung-geaendert
    rule: Aktualisiere die Leistung.
  - boundedContext: naturheilpraxis
    event: leistung-geloescht
    rule: Entferne die Leistung.
  - boundedContext: naturheilpraxis
    event: rechnung-erstellt
    rule: Ordne die Leistungen der Rechnung als Entwurf zu.
  - boundedContext: naturheilpraxis
    event: rechnung-geaendert
    rule: >-
      Ordne die Leistungen der Rechnung zu; Leistungen, die nicht mehr enthalten sind, sind nicht
      mehr abgerechnet.
  - boundedContext: naturheilpraxis
    event: entwurf-geloescht
    rule: Die Leistungen des Entwurfs sind nicht mehr abgerechnet.
  - boundedContext: naturheilpraxis
    event: rechnung-versendet
    rule: Die Rechnung der Leistungen ist versendet und hat eine Rechnungsnummer.
  - boundedContext: naturheilpraxis
    event: rechnungsversand-zurueckgenommen
    rule: Die Rechnung der Leistungen ist wieder ein Entwurf ohne Rechnungsnummer.
  - boundedContext: naturheilpraxis
    event: rechnung-bezahlt
    rule: Die Rechnung der Leistungen ist bezahlt.
  - boundedContext: naturheilpraxis
    event: rechnungszahlung-zurueckgenommen
    rule: Die Rechnung der Leistungen ist wieder versendet.
schema:
  type: array
  items:
    type: object
    oneOf:
      - properties:
          art:
            const: diagnose
          eintrag:
            $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=diagnose
      - properties:
          art:
            const: leistung
          eintrag:
            $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=leistung
          rechnung:
            description: Die Rechnung, in der die Leistung enthalten ist; fehlt, wenn sie offen ist.
            type: object
            properties:
              rechnungId:
                type: string
                format: uuid
              rechnungsnummer:
                $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsnummer
              status:
                $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsstatus
            required:
              - rechnungId
              - status
            additionalProperties: false
    required:
      - art
      - eintrag
    unevaluatedProperties: false

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: query
name: behandlungen-ermitteln
description: >-
  Ermittelt die Behandlungshistorie eines Patienten.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
readModel: behandlungsansicht
paradigm: time-series
parameters:
  type: object
  properties:
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
  required:
    - patientennummer
  additionalProperties: false
result:
  type: array
  items:
    type: object
    oneOf:
      - properties:
          art:
            const: diagnose
          eintrag:
            $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=diagnose
      - properties:
          art:
            const: leistung
          eintrag:
            $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=leistung
          rechnung:
            description: Die Rechnung, in der die Leistung enthalten ist; fehlt, wenn sie offen ist.
            type: object
            properties:
              rechnungId:
                type: string
                format: uuid
              rechnungsnummer:
                $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsnummer
              status:
                $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsstatus
            required:
              - rechnungId
              - status
            additionalProperties: false
    required:
      - art
      - eintrag
    unevaluatedProperties: false
actors:
  - heilpraktiker
constraints:
  - name: nur-eintraege-des-patienten
    rule: >-
      Enthält nur Einträge zu der gegebenen Patientennummer.
  - name: neueste-zuerst
    rule: >-
      Die Einträge sind absteigend nach Datum sortiert; bei gleichem Datum steht die Diagnose vor
      den Leistungen.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: query
name: diagnosen-ermitteln
description: >-
  Ermittelt die Diagnosen eines Patienten.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
readModel: behandlungsansicht
paradigm: tabular
parameters:
  type: object
  properties:
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
  required:
    - patientennummer
  additionalProperties: false
result:
  type: array
  items:
    $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/entity=diagnose
actors:
  - heilpraktiker
constraints:
  - name: nur-eintraege-des-patienten
    rule: >-
      Enthält nur Einträge zu der gegebenen Patientennummer.
  - name: neueste-zuerst
    rule: >-
      Die Diagnosen sind absteigend nach Datum sortiert.
