# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: patientenkartei
description: Der Heilpraktiker pflegt die Stammdaten eines aufgenommenen Patienten.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: patientenkartei
scenarios:
  - name: patientendaten-aendern
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 2
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1982-03-14"
          name: { vorname: Erika, nachname: Mustermann }
    when:
      command: patientendaten-aendern
      data:
        patientennummer: 1
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "1980-09-20"
        name: { vorname: Max, nachname: Mustermann }
        anschrift: { strasse: Lindenweg 5, postleitzahl: "12345", ort: Musterstadt }
        partnerVon: 2
    then:
      events:
        - event: patientendaten-geaendert
          data:
            patientennummer: 1
            praxiskuerzel: NHP
            aufnahmejahr: 2026
            geburtsdatum: "1980-09-20"
            name: { vorname: Max, nachname: Mustermann }
            anschrift: { strasse: Lindenweg 5, postleitzahl: "12345", ort: Musterstadt }
            partnerVon: 2

  - name: patient-in-unbekannte-praxis-verschieben
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: patientendaten-aendern
      data:
        patientennummer: 1
        praxiskuerzel: XYZ
        aufnahmejahr: 2026
        geburtsdatum: "1980-09-20"
        name: { vorname: Max, nachname: Mustermann }
    then:
      rejection:
        invariant: praxis-existiert

  - name: unbekannten-angehoerigen-angeben
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: patientendaten-aendern
      data:
        patientennummer: 1
        praxiskuerzel: NHP
        aufnahmejahr: 2026
        geburtsdatum: "1980-09-20"
        name: { vorname: Max, nachname: Mustermann }
        kindVon: 7
    then:
      rejection:
        invariant: angehoerige-existieren
