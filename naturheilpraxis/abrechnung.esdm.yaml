# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: abrechnung
description: >-
  Verwaltet die Rechnungen. Für die Rechnungsnummer beim Versand müssen zusätzlich die versendeten
  Rechnungen desselben Patienten am selben Rechnungsdatum betrachtet werden, um die niedrigste freie
  Nummer zu kennen. Beim Erstellen und Ändern einer Rechnung müssen zusätzlich die genannten
  Leistungen und alle Rechnungen betrachtet werden, die eine dieser Leistungen enthalten oder
  enthielten, damit keine Leistung doppelt abgerechnet wird.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
identifiedBy:
  - name: rechnung
    source: command-payload
    field: rechnungId
consults:
  - boundedContext: naturheilpraxis
    event: rechnung-erstellt
    criteria: >-
      Die ID ist die gleiche wie im auslösenden Befehl. Beim Erstellen und Ändern zusätzlich alle
      Ereignisse, die eine der im Befehl genannten Leistungen enthalten.
  - boundedContext: naturheilpraxis
    event: rechnung-geaendert
    criteria: >-
      Die ID ist die gleiche wie im auslösenden Befehl. Beim Erstellen und Ändern zusätzlich alle
      Ereignisse der Rechnungen, die eine der im Befehl genannten Leistungen enthalten oder
      enthielten.
  - boundedContext: naturheilpraxis
    event: entwurf-geloescht
    criteria: >-
      Die ID ist die gleiche wie im auslösenden Befehl. Beim Erstellen und Ändern zusätzlich alle
      Ereignisse der Rechnungen, die eine der im Befehl genannten Leistungen enthielten.
  - boundedContext: naturheilpraxis
    event: rechnung-versendet
    criteria: >-
      Die ID ist die gleiche wie im auslösenden Befehl. Beim Versenden zusätzlich alle Ereignisse,
      deren Patientennummer und Datum die gleichen wie im auslösenden Befehl sind.
  - boundedContext: naturheilpraxis
    event: rechnung-bezahlt
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnungszahlung-zurueckgenommen
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnungsversand-zurueckgenommen
    criteria: >-
      Die ID ist die gleiche wie im auslösenden Befehl. Beim Versenden zusätzlich alle Ereignisse,
      deren Patientennummer und Datum die gleichen wie im auslösenden Befehl sind.
  - boundedContext: naturheilpraxis
    event: leistung-erbracht
    criteria: Beim Erstellen und Ändern die Ereignisse der im Befehl genannten Leistungen.
  - boundedContext: naturheilpraxis
    event: leistung-geaendert
    criteria: Beim Erstellen und Ändern die Ereignisse der im Befehl genannten Leistungen.
  - boundedContext: naturheilpraxis
    event: leistung-geloescht
    criteria: Beim Erstellen und Ändern die Ereignisse der im Befehl genannten Leistungen.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: rechnung-erstellen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: abrechnung
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
    praxiskuerzel:
      type: string
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
    diagnosetext:
      type: string
    rechnungstext:
      type: string
    leistungen:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
  required:
    - rechnungId
    - praxiskuerzel
    - patientennummer
    - diagnosetext
    - rechnungstext
    - leistungen
  additionalProperties: false
publishes:
  - rechnung-erstellt
actors:
  - heilpraktiker
constraints:
  - name: leistungen-existieren
    rule: Jede genannte Leistung wurde erbracht und ist nicht gelöscht.
  - name: leistungen-des-patienten
    rule: Jede genannte Leistung gehört zum Patienten der Rechnung.
  - name: leistungen-nicht-abgerechnet
    rule: >-
      Keine der genannten Leistungen ist bereits in einer anderen Rechnung enthalten, unabhängig von
      deren Status.

---
