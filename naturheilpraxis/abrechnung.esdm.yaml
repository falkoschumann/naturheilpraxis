# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: rechnung-versenden
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: abrechnung
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
    datum:
      type: string
      format: date
  required:
    - rechnungId
    - datum
  additionalProperties: false
publishes:
  - rechnung-versendet
actors:
  - heilpraktiker
constraints:
  - name: rechnungsnummer-erstellen
    rule: >-
      Im Ereignis `rechnung-versendet` wird die vergebene Rechnungsnummer angegeben. Die neue
      Rechnungsnummer hat das Format `P/JJMMTT[-N]` und besteht aus der Patientennummer `P` und dem
      Rechnungsdatum `JJMMTT`. Gibt es mehr als eine Rechnung für denselben Patienten an einem Tag,
      wird eine fortlaufende Zahl `-N` angehängt, beginnend bei 2. Vergeben sind nur die Nummern
      versendeter und bezahlter Rechnungen; eine durch Zurücknahme des Versands frei gewordene
      Nummer kann wieder vergeben werden. Es wird immer die niedrigste freie Nummer vergeben.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: rechnung-versendet
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
    rechnungsnummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsnummer
    datum:
      type: string
      format: date
  required:
    - rechnungId
    - rechnungsnummer
    - datum
  additionalProperties: false

---
