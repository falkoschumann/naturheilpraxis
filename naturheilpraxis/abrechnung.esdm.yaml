name: rechnungszahlung-zurueckgenommen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
  required:
    - rechnungId
  additionalProperties: false

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: rechnungsversand-zurueckgenommen
description: >-
  Die Rechnung ist wieder ein Entwurf und hat keine Rechnungsnummer und kein Rechnungsdatum mehr.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
  required:
    - rechnungId
  additionalProperties: false
