# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: event
name: rechnungsversand-zurueckgenommen
description: >-
  Die Rechnung ist wieder ein Entwurf und hat keine Rechnungsnummer und kein Rechnungsdatum mehr.
  Das Ereignis nennt die frei gewordene Rechnungsnummer und das bisherige Rechnungsdatum.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
    rechnungsnummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=rechnungsnummer
    datum:
      type: string
      format: date
  required:
    - rechnungId
    - patientennummer
    - rechnungsnummer
    - datum
  additionalProperties: false
