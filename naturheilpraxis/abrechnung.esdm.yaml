# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: abrechnung
description: >-
  Verwaltet die Rechnungen.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
identifiedBy:
  - name: rechnung
    source: command-payload
    field: rechnungId
consults:
  - boundedContext: naturheilpraxis
    event: rechnung-erstellt
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnung-geaendert
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: entwurf-geloescht
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnung-versendet
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnung-bezahlt
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnungszahlung-zurueckgenommen
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: rechnungsversand-zurueckgenommen
    criteria: Die ID ist die gleiche wie im auslösenden Befehl.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: rechnung-erstellen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: abrechnung
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
    praxiskuerzel:
      type: string
    patientennummer:
      $ref: esdm:domain=naturheilpraxis/bounded-context=naturheilpraxis/value-object=patientennummer
    diagnosetext:
      type: string
    rechnungstext:
      type: string
    leistungen:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
  required:
    - rechnungId
    - praxiskuerzel
    - patientennummer
    - diagnosetext
    - rechnungstext
    - leistungen
  additionalProperties: false
publishes:
  - rechnung-erstellt
actors:
  - heilpraktiker

---
