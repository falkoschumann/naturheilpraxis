---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: command
name: rechnung-zurueckstufen
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: abrechnung
data:
  type: object
  properties:
    rechnungId:
      type: string
      format: uuid
  required:
    - rechnungId
  additionalProperties: false
publishes:
  - rechnungszahlung-zurueckgenommen
  - rechnungsversand-zurueckgenommen
actors:
  - heilpraktiker
constraints:
  - name: ereignis-haengt-vom-status-ab
    rule: >-
      Es wird immer genau eines der beiden Ereignisse emittiert: im Status `bezahlt` das Ereignis
      `rechnungszahlung-zurueckgenommen`, im Status `versendet` das Ereignis
      `rechnungsversand-zurueckgenommen`.
  - name: versand-zuruecknehmen-entfernt-nummer
    rule: >-
      Wird der Versand zurückgenommen, verliert die Rechnung Rechnungsnummer und Rechnungsdatum.
      Beide werden beim erneuten Versand neu vergeben.

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
