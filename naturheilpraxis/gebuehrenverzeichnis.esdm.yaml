# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: dynamic-consistency-boundary
name: gebuehrenverzeichnis
description: >-
  Die Gebührenziffer muss im Gebührenverzeichnis eindeutig sein. Dafür reicht es, alle Ereignisse
  mit der gleichen Ziffer zu betrachten.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
identifiedBy:
  - name: gebuehr
    source: command-payload
    field: ziffer
consults:
  - boundedContext: naturheilpraxis
    event: gebuehr-angelegt
    criteria: Die Ziffer ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: gebuehr-geaendert
    criteria: Die Ziffer ist die gleiche wie im auslösenden Befehl.
  - boundedContext: naturheilpraxis
    event: gebuehr-entfernt
    criteria: Die Ziffer ist die gleiche wie im auslösenden Befehl.

