# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: diagnosestellung
description: Der Heilpraktiker stellt Diagnosen für Patienten, ändert und löscht sie.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: diagnosestellung
scenarios:
  - name: diagnose-stellen
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: diagnose-stellen
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
        praxiskuerzel: NHP
        patientennummer: 1
        datum: "2026-09-14"
        text: Chronische Rückenschmerzen
    then:
      events:
        - event: diagnose-gestellt
          data:
            diagnoseId: 11111111-1111-4111-8111-111111111111
            praxiskuerzel: NHP
            patientennummer: 1
            datum: "2026-09-14"
            text: Chronische Rückenschmerzen

  - name: diagnose-aendern
    description: Das Ereignis enthält die bisherige Patientennummer, da sie nicht geändert wird.
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: diagnose-gestellt
        data:
          diagnoseId: 11111111-1111-4111-8111-111111111111
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          text: Chronische Rückenschmerzen
    when:
      command: diagnose-aendern
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
        praxiskuerzel: NHP
        datum: "2026-09-14"
        text: Chronische Rückenschmerzen im Lendenwirbelbereich
    then:
      events:
        - event: diagnose-geaendert
          data:
            diagnoseId: 11111111-1111-4111-8111-111111111111
            praxiskuerzel: NHP
            patientennummer: 1
            datum: "2026-09-14"
            text: Chronische Rückenschmerzen im Lendenwirbelbereich

  - name: diagnose-loeschen
    given:
      - boundedContext: naturheilpraxis
        event: diagnose-gestellt
        data:
          diagnoseId: 11111111-1111-4111-8111-111111111111
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          text: Chronische Rückenschmerzen
    when:
      command: diagnose-loeschen
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
    then:
      events:
        - event: diagnose-geloescht
          data:
            diagnoseId: 11111111-1111-4111-8111-111111111111

  - name: nicht-vorhandene-diagnose-loeschen
    description: Löschen ist idempotent. Eine nicht vorhandene Diagnose zu löschen, ändert nichts.
    given: []
    when:
      command: diagnose-loeschen
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
    then:
      events: []

  - name: diagnose-in-unbekannter-praxis-stellen
    given:
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: diagnose-stellen
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
        praxiskuerzel: XYZ
        patientennummer: 1
        datum: "2026-09-14"
        text: Chronische Rückenschmerzen
    then:
      rejection:
        invariant: praxis-existiert

  - name: diagnose-fuer-unbekannten-patienten-stellen
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
    when:
      command: diagnose-stellen
      data:
        diagnoseId: 11111111-1111-4111-8111-111111111111
        praxiskuerzel: NHP
        patientennummer: 7
        datum: "2026-09-14"
        text: Chronische Rückenschmerzen
    then:
      rejection:
        invariant: patient-existiert
