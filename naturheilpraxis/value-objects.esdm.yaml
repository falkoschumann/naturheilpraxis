# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
kind: value-object
name: personenname
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
schema:
  type: object
  properties:
    anrede:
      type: string
    titel:
      type: string
    vorname:
      type: string
    nachname:
      type: string
  required:
    - vorname
    - nachname
  additionalProperties: false

---
# $schema: ../schemas/core/v1.yaml
apiVersion: schema.esdm.io/core/v1
