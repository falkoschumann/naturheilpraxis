# $schema: ../schemas/given-when-then/v1.yaml
apiVersion: schema.esdm.io/given-when-then/v1
kind: feature
name: leistungserbringung
description: >-
  Der Heilpraktiker erbringt Leistungen für Patienten, ändert und löscht sie, solange die Rechnung
  es zulässt.
scope:
  domain: naturheilpraxis
  boundedContext: naturheilpraxis
  dynamicConsistencyBoundary: leistungserbringung
scenarios:
  - name: leistung-erbringen
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: patient-aufgenommen
        data:
          patientennummer: 1
          praxiskuerzel: NHP
          aufnahmejahr: 2026
          geburtsdatum: "1980-09-20"
          name: { vorname: Max, nachname: Mustermann }
    when:
      command: leistung-erbringen
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
        praxiskuerzel: NHP
        patientennummer: 1
        datum: "2026-09-14"
        ziffer: "1"
        bezeichnung: Eingehende Untersuchung
        anzahl: 1
        einzelbetrag: { cents: 2050 }
    then:
      events:
        - event: leistung-erbracht
          data:
            leistungId: 22222222-2222-4222-8222-222222222222
            praxiskuerzel: NHP
            patientennummer: 1
            datum: "2026-09-14"
            ziffer: "1"
            bezeichnung: Eingehende Untersuchung
            anzahl: 1
            einzelbetrag: { cents: 2050 }

  - name: leistung-im-entwurf-aendern
    description: >-
      Eine Leistung in einem Entwurf darf geändert werden. Das Ereignis enthält die bisherige
      Patientennummer.
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
      - boundedContext: naturheilpraxis
        event: rechnung-erstellt
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          praxiskuerzel: NHP
          patientennummer: 1
          diagnosetext: Chronische Rückenschmerzen
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
          leistungen:
            - 22222222-2222-4222-8222-222222222222
    when:
      command: leistung-aendern
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
        praxiskuerzel: NHP
        datum: "2026-09-14"
        ziffer: "1"
        bezeichnung: Eingehende Untersuchung
        anzahl: 2
        einzelbetrag: { cents: 2050 }
    then:
      events:
        - event: leistung-geaendert
          data:
            leistungId: 22222222-2222-4222-8222-222222222222
            praxiskuerzel: NHP
            patientennummer: 1
            datum: "2026-09-14"
            ziffer: "1"
            bezeichnung: Eingehende Untersuchung
            anzahl: 2
            einzelbetrag: { cents: 2050 }

  - name: leistung-einer-versendeten-rechnung-aendern
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
      - boundedContext: naturheilpraxis
        event: rechnung-erstellt
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          praxiskuerzel: NHP
          patientennummer: 1
          diagnosetext: Chronische Rückenschmerzen
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
          leistungen:
            - 22222222-2222-4222-8222-222222222222
      - boundedContext: naturheilpraxis
        event: rechnung-versendet
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          patientennummer: 1
          rechnungsnummer: 1/260920
          datum: "2026-09-20"
    when:
      command: leistung-aendern
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
        praxiskuerzel: NHP
        datum: "2026-09-14"
        ziffer: "1"
        bezeichnung: Eingehende Untersuchung
        anzahl: 2
        einzelbetrag: { cents: 2050 }
    then:
      rejection:
        invariant: nur-im-entwurf-aendern

  - name: leistung-in-unbekannte-praxis-verschieben
    given:
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
    when:
      command: leistung-aendern
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
        praxiskuerzel: XYZ
        datum: "2026-09-14"
        ziffer: "1"
        bezeichnung: Eingehende Untersuchung
        anzahl: 1
        einzelbetrag: { cents: 2050 }
    then:
      rejection:
        invariant: praxis-existiert

  - name: leistung-fuer-unbekannten-patienten-erbringen
    given:
      - boundedContext: naturheilpraxis
        event: praxis-angelegt
        data:
          praxiskuerzel: NHP
          name: Naturheilpraxis am Markt
          anschrift: { strasse: Marktplatz 1, postleitzahl: "12345", ort: Musterstadt }
    when:
      command: leistung-erbringen
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
        praxiskuerzel: NHP
        patientennummer: 7
        datum: "2026-09-14"
        ziffer: "1"
        bezeichnung: Eingehende Untersuchung
        anzahl: 1
        einzelbetrag: { cents: 2050 }
    then:
      rejection:
        invariant: patient-existiert

  - name: leistung-loeschen
    given:
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
    when:
      command: leistung-loeschen
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
    then:
      events:
        - event: leistung-geloescht
          data:
            leistungId: 22222222-2222-4222-8222-222222222222

  - name: leistung-nach-loeschen-des-entwurfs-loeschen
    description: Wird der Entwurf gelöscht, ist die Leistung wieder frei und darf gelöscht werden.
    given:
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
      - boundedContext: naturheilpraxis
        event: rechnung-erstellt
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          praxiskuerzel: NHP
          patientennummer: 1
          diagnosetext: Chronische Rückenschmerzen
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
          leistungen:
            - 22222222-2222-4222-8222-222222222222
      - boundedContext: naturheilpraxis
        event: entwurf-geloescht
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
    when:
      command: leistung-loeschen
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
    then:
      events:
        - event: leistung-geloescht
          data:
            leistungId: 22222222-2222-4222-8222-222222222222

  - name: leistung-eines-entwurfs-loeschen
    given:
      - boundedContext: naturheilpraxis
        event: leistung-erbracht
        data:
          leistungId: 22222222-2222-4222-8222-222222222222
          praxiskuerzel: NHP
          patientennummer: 1
          datum: "2026-09-14"
          ziffer: "1"
          bezeichnung: Eingehende Untersuchung
          anzahl: 1
          einzelbetrag: { cents: 2050 }
      - boundedContext: naturheilpraxis
        event: rechnung-erstellt
        data:
          rechnungId: 33333333-3333-4333-8333-333333333333
          praxiskuerzel: NHP
          patientennummer: 1
          diagnosetext: Chronische Rückenschmerzen
          rechnungstext: Bitte überweisen Sie den Betrag innerhalb von 14 Tagen.
          leistungen:
            - 22222222-2222-4222-8222-222222222222
    when:
      command: leistung-loeschen
      data:
        leistungId: 22222222-2222-4222-8222-222222222222
    then:
      rejection:
        invariant: nur-ohne-rechnung-loeschen
